name: Python checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements-windows-lock.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Compile application and tests
        run: python -m compileall -q mailanalyst tests
      - name: Regression and architecture tests
        run: python -m unittest discover -v
      - name: Documentation links
        run: python -m scripts.check_doc_links
      - name: Portable build
        shell: pwsh
        run: .\build_exe.ps1 -PythonPath (Get-Command python).Source
